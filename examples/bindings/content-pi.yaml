apiVersion: multiverse/v0.1
kind: BindingSet
metadata:
  name: content-pi
  version: 0.1.0
spec:
  slots:
    producer:
      adapter: pi
      executorRef: builtin.pi-deliverable.v1
      config:
        cwd: /absolute/path/to/approved/workspace
        workspaceRoot: /absolute/path/to/approved/workspace
        homeDir: /absolute/path/to/approved/pi-home
        expectedVersion: 1.0.1
        model: default
        systemPrompt: Return only concise JSON with a non-empty text field and an empty artifact_refs array. Do not invent Artifact IDs.
        artifactName: pi-deliverable.md
        artifactMediaType: text/markdown
        timeoutSeconds: 180
      secretRefs: {}
      grants:
        - action: content.produce
          resource: namespace:demo
    critic:
      adapter: builtin
      executorRef: example.content-fixture.v1
      config: {}
      secretRefs: {}
      grants:
        - action: content.review
          resource: namespace:demo
    verifier:
      adapter: builtin
      executorRef: builtin.nonempty-deliverable.v1
      config: {}
      secretRefs: {}
      grants: []
    reviewer:
      adapter: human
      executorRef: builtin.human-review.v1
      config:
        requestType: review
        choices: [approve, reject]
        authorizedSubjects: [example-reviewer]
        requireCommentFor: [reject]
      secretRefs: {}
      grants: []
