[project]
name = "multiverse-workflow"
version = "0.1.0"
description = "Portable, verifiable workflow protocol and runtime."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.116,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.11,<3",
  "ruamel.yaml>=0.18,<0.19",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
mverse = "multiverse_workflow.cli.main:app"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.23,<5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multiverse_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
